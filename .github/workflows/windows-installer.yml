name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build standalone application
        run: python -m PyInstaller --noconfirm --clean --windowed --name ApexRig-AI --paths src src\app.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\ApexRig-AI\ApexRig-AI.exe")) {
            throw "PyInstaller did not produce dist\ApexRig-AI\ApexRig-AI.exe"
          }

      - name: Package application folder
        shell: pwsh
        run: Compress-Archive -Path "dist\ApexRig-AI\*" -DestinationPath "dist\ApexRig-AI-Windows-x64.zip" -Force

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexRig-AI-Windows-EXE
          path: dist/ApexRig-AI-Windows-x64.zip
          if-no-files-found: error
