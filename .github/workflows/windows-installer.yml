name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone application
        run: pyinstaller --noconfirm --clean --windowed --name ApexRig-AI --paths src src\app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer\ApexRig-AI.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexRig-AI-Windows-Installer
          path: dist/ApexRig-AI-Setup-0.5.0.exe
          if-no-files-found: error
